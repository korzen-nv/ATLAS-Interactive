defaults:
  - _self_
  - model: base

hydra:
  searchpath:
    - pkg://sam2

# workspace configuration
workspace_root: ./workspace
image_endpoint: images
mask_endpoint: masks
vis_endpoint: vis

# Backend selection: cutie | sam2 | sam3
backend: sam3

amp: True
weights: gui/weights/cutie-surgenetseg-50k.pth
ritm_weights: gui/weights/ritm-surgenetseg-50k.pth

# SAM 2 config (only used when backend: sam2)
#sam2_weights:  gui/weights/sam2.1_hiera_large.pt
#sam2_model_cfg: sam2.1/sam2.1_hiera_l.yaml

sam2_weights: gui/weights/surgisam2_chkpt_26.pt
sam2_model_cfg: sam2.1/sam2.1_hiera_b+.yaml

#sam2_weights: gui/weights/MedSAM2_latest.pt
#sam2_model_cfg: sam2.1/sam2.1_hiera_t.yaml

# SAM 3 config (only used when backend: sam3)
# Set sam3_weights to null to auto-download from HuggingFace (facebook/sam3)
# Or provide a path to a local sam3.pt checkpoint
#sam3_weights: gui/weights/sam3_sean_merged.pt
sam3_weights: gui/weights/sam3.pt
sam3_model_cfg: null
sam3_bpe_path: null

# All "size" parameters represent the length of the shorter edge
# maximum internal processing size; reducing this speeds up processing
max_internal_size: 480

# maximum size for extracting frames; the output will also be in this size
# reducing this mainly speed up I/O
# it should not be smaller than the internal size
max_overall_size: 1080
buffer_size: 20

# we use multithreading for saving the results
save_queue_size: 20
num_save_threads: 4

# for reading
num_read_workers: 4

# for exporting video
output_fps: 24
output_bitrate: 1 # in Mbps

use_long_term: True
mem_every: 5
top_k: 30
stagger_updates: 5
chunk_size: -1 # number of objects to process in parallel; -1 means unlimited

# only relevant when long_term is not enabled
max_mem_frames: 5

# only relevant when long_term is enabled
long_term:
  count_usage: True
  max_mem_frames: 10
  min_mem_frames: 5
  num_prototypes: 128
  max_num_tokens: 10000
  buffer_tokens: 2000

save_aux: False
flip_aug: False
